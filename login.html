<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20y1%3D'0'%20x2%3D'1'%20y2%3D'1'%3E%3Cstop%20offset%3D'0'%20stop-color%3D'%238bd450'%2F%3E%3Cstop%20offset%3D'.5'%20stop-color%3D'%238bd450'%2F%3E%3Cstop%20offset%3D'.5'%20stop-color%3D'%239a6a45'%2F%3E%3Cstop%20offset%3D'1'%20stop-color%3D'%239a6a45'%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20x%3D'0'%20y%3D'0'%20width%3D'100'%20height%3D'100'%20rx%3D'24'%20fill%3D'url(%23g)'%2F%3E%3Crect%20x%3D'4'%20y%3D'4'%20width%3D'92'%20height%3D'92'%20rx%3D'22'%20fill%3D'none'%20stroke%3D'%23fff'%20stroke-width%3D'4'%20stroke-opacity%3D'.3'%2F%3E%3C%2Fsvg%3E">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<title>Minicraft — Entrar</title>
<script>
/* Tema antes del CSS: sin flash. Sin preferencia guardada arranca en oscuro (identidad del juego). */
(function () {
  var saved = null;
  try { saved = localStorage.getItem('mc-theme'); } catch (e) {}
  document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
})();
</script>
<style>
  :root {
    color-scheme: dark;
    --bg:#0b1410; --bg-2:#12211a; --panel:#14231b; --panel-2:#0f1b15;
    --line:#2b3d30; --line-strong:#3d5442;
    --text:#e9f2e6; --dim:#9db2a2;
    --accent:#7ec850; --accent-strong:#9bdb6d; --accent-ink:#0d1c08; --accent-deep:#3d6f24;
    --grass:#7ec850; --dirt:#8a5a35;
    --danger:#ff9d90; --field:#0d1812;
    --shadow-hard: rgba(0,0,0,.55); --glow: rgba(126,200,80,.20); --grid: rgba(126,200,80,.055);
    --focus:#8fc4ff;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg:#e9efe0; --bg-2:#f7faf1; --panel:#fbfdf6; --panel-2:#eef4e6;
    --line:#cbd8c0; --line-strong:#a9bd9c;
    --text:#18251a; --dim:#5c6f5d;
    --accent:#3f8f2e; --accent-strong:#2f7022; --accent-ink:#f6fbf2; --accent-deep:#2a5f1d;
    --grass:#4f9c3a; --dirt:#95613a;
    --danger:#a5271c; --field:#ffffff;
    --shadow-hard: rgba(40,64,38,.22); --glow: rgba(63,143,46,.18); --grid: rgba(50,90,45,.07);
    --focus:#1d63c8;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background:
      radial-gradient(900px 520px at 12% -12%, var(--glow), transparent 70%),
      radial-gradient(760px 460px at 110% 108%, var(--glow), transparent 65%),
      repeating-linear-gradient(0deg, transparent 0 31px, var(--grid) 31px 32px),
      repeating-linear-gradient(90deg, transparent 0 31px, var(--grid) 31px 32px),
      linear-gradient(160deg, var(--bg-2), var(--bg) 60%);
    background-attachment: fixed;
    display: grid; place-items: center; padding: 72px 20px 40px;
  }
  main {
    position: relative; width: min(432px, 100%);
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line); border-radius: 6px; padding: 30px 26px 26px;
    box-shadow: 8px 8px 0 var(--shadow-hard), 0 30px 70px -34px rgba(0, 0, 0, .75);
  }
  main::before {
    content: ''; position: absolute; inset: 6px 6px auto; height: 1px;
    background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
  }
  .logo {
    display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 800;
    letter-spacing: .16em; font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  .logo-mark {
    width: 22px; height: 22px; flex: none; border-radius: 3px;
    background: linear-gradient(180deg, var(--grass) 0 50%, var(--dirt) 50% 100%);
    box-shadow: inset -3px 0 0 rgba(0, 0, 0, .2), 0 3px 0 var(--accent-deep);
  }
  h1 { font-size: clamp(23px, 5vw, 28px); line-height: 1.15; margin: 18px 0 6px; font-weight: 800; letter-spacing: -.01em; }
  .lede { margin: 0 0 4px; color: var(--dim); font-size: 14px; line-height: 1.5; }
  label { display: block; margin: 16px 0 6px; font-size: 13px; font-weight: 600; color: var(--dim); }
  input {
    width: 100%; min-height: 48px; padding: 11px 13px; font: inherit; font-size: 16px;
    color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 5px;
    transition: border-color .16s, box-shadow .16s;
  }
  input:hover { border-color: var(--line-strong); }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
  /* Chromium/Edge: el campo deja de ser type=password para que el gestor
     integrado no ofrezca guardar; el enmascarado lo hace CSS. Firefox conserva
     type=password (no soporta esta propiedad). */
  .secret { -webkit-text-security: disc; text-security: disc; }
  button[type=submit] {
    width: 100%; min-height: 50px; margin-top: 22px; padding: 12px 18px; border: 0; border-radius: 5px;
    cursor: pointer; background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 16px;
    font-weight: 800; letter-spacing: .02em;
    box-shadow: 0 4px 0 var(--accent-deep), 0 14px 26px -14px var(--glow);
    transition: transform .16s, box-shadow .16s, background .16s, filter .16s;
  }
  button[type=submit]:hover {
    background: var(--accent-strong); transform: translateY(-2px);
    box-shadow: 0 6px 0 var(--accent-deep), 0 18px 30px -14px var(--glow);
  }
  button[type=submit]:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent-deep); }
  button[type=submit][disabled] { opacity: .6; cursor: progress; transform: none; }
  .error { min-height: 20px; margin-top: 12px; color: var(--danger); font-size: 14px; }
  .foot { margin-top: 20px; color: var(--dim); font-size: 14px; text-align: center; }
  .hint { margin: 10px auto 0; max-width: 36ch; font-size: 12.5px; line-height: 1.55; color: var(--dim); text-align: center; }
  a { color: var(--accent-strong); text-decoration: none; border-bottom: 1px solid transparent; transition: color .16s, border-color .16s; }
  a:hover { color: var(--accent); border-bottom-color: currentColor; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .theme-toggle {
    position: fixed; top: 18px; right: 18px; width: 46px; height: 46px; display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--text);
    cursor: pointer; box-shadow: 4px 4px 0 var(--shadow-hard);
    transition: transform .16s, border-color .16s, color .16s, box-shadow .16s;
  }
  .theme-toggle:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent-strong); }
  .theme-toggle:active { transform: translateY(1px); box-shadow: 2px 2px 0 var(--shadow-hard); }
  .theme-toggle svg { width: 20px; height: 20px; display: block; }
  .theme-toggle .i-sun { display: none; }
  html[data-theme="light"] .theme-toggle .i-sun { display: block; }
  html[data-theme="light"] .theme-toggle .i-moon { display: none; }
  @media (max-width: 520px) {
    body { padding-top: 76px; }
    main { padding: 26px 20px 22px; box-shadow: 6px 6px 0 var(--shadow-hard); }
    .theme-toggle { top: 12px; right: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Tema claro" aria-pressed="false" title="Cambiar entre tema claro y oscuro">
  <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5Z"/></svg>
  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/></svg>
</button>
<main>
  <div class="logo"><span class="logo-mark"></span>MINICRAFT</div>
  <h1>Entrar a tu cuenta</h1>
  <p class="lede">Tu nombre y tu aspecto salen del perfil, no del juego.</p>
  <form id="loginForm" novalidate autocomplete="off">
    <!-- Política de autocompletado: off + atributos de ignorado reducen las pestañas y el
         prompt de guardar. Ningún sitio puede impedir al 100% que el navegador lo ofrezca. -->
    <label for="username">Usuario</label>
    <input id="username" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-dashlane-ignore="true" required minlength="3" maxlength="16">
    <label for="password">Contraseña</label>
    <input id="password" type="text" class="secret" data-secret="1" autocomplete="off" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-dashlane-ignore="true" required minlength="8" maxlength="128">
    <button type="submit" id="submitBtn">Entrar</button>
    <div class="error" id="formError" role="alert" aria-live="polite"></div>
  </form>
  <div class="foot">¿No tenés cuenta? <a href="/register">Crear una</a></div>
  <div class="hint">La sesión dura 7 días. Podés cerrarla desde el lobby.</div>
</main>
<script>
(function () {
  // Tema claro/oscuro (spec ui/lobby): persistente y accesible, no toca el formulario.
  const themeBtn = document.getElementById('themeToggle');
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeBtn.setAttribute('aria-pressed', theme === 'light' ? 'true' : 'false');
  }
  applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
  themeBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem('mc-theme', next); } catch (e) {}
  });

  // Los campos nacen como type=text enmascarado: Edge/Chromium dispara el
  // prompt de "guardar contraseña" con solo ver type=password en el HTML.
  // En navegadores sin enmascarado CSS (Firefox) se vuelve a type=password.
  (function initSecrets() {
    const fields = document.querySelectorAll('[data-secret]');
    try {
      const supported = (window.CSS && CSS.supports && CSS.supports('-webkit-text-security', 'disc'))
        || ('webkitTextSecurity' in document.documentElement.style);
      fields.forEach((el) => {
        if (supported) {
          el.type = 'text';
          el.classList.add('secret');
          el.style.webkitTextSecurity = 'disc';
          el.setAttribute('autocomplete', 'off');
          el.setAttribute('data-form-type', 'other');
        } else {
          el.type = 'password';
          el.classList.remove('secret');
          el.style.webkitTextSecurity = '';
        }
      });
    } catch (e) {
      fields.forEach((el) => { el.type = 'password'; el.classList.remove('secret'); });
    }
  })();

  const form = document.getElementById('loginForm');
  const err = document.getElementById('formError');
  const btn = document.getElementById('submitBtn');
  function show(msg) { err.textContent = msg; }
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    show('');
    const username = document.getElementById('username').value.trim();
    const passEl = document.getElementById('password');
    const password = passEl.value;
    passEl.value = ''; // vacío antes del submit: el gestor no tiene qué guardar
    if (!username || !password) { passEl.value = password; show('Escribí tu usuario y tu contraseña.'); return; }
    let ok = false;
    btn.disabled = true;
    try {
      const res = await fetch('/api/login', {
        method: 'POST', credentials: 'same-origin', cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (res.ok) { ok = true; location.replace('/lobby'); return; }
      if (res.status === 429) show('Demasiados intentos: esperá un momento e intentá de nuevo.');
      else if (res.status === 503) show('El servicio no está disponible. Probá de nuevo en unos segundos.');
      else show('Usuario o contraseña incorrectos');
    } catch (e) {
      show('No se pudo conectar. Revisá tu conexión e intentá de nuevo.');
    } finally {
      if (!ok) passEl.value = password; // devuelve lo escrito si falló
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
