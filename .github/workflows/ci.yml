name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (unitarios + HTTP/WS + integración DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: minicraft_test
          POSTGRES_USER: minicraft
          POSTGRES_PASSWORD: minicraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minicraft -d minicraft_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://minicraft:minicraft@localhost:5432/minicraft_test
      REQUIRE_DB_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Deps
        working-directory: server
        run: npm ci --omit=dev

      - name: Tests
        working-directory: server
        run: npm test
