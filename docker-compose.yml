services:
  # PostgreSQL: fuente de verdad de usuarios y sesiones. Sin puertos públicos:
  # se accede por el nombre interno `db` (docker compose exec db psql -U minicraft).
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minicraft
      POSTGRES_USER: minicraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minicraft-dev}
    volumes:
      - minicraft-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicraft -d minicraft"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minicraft:
    build: .
    image: minicraft:latest
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://minicraft:minicraft-dev@db:5432/minicraft}
      # Primer arranque: crea el admin si no existe. La contraseña NUNCA se loguea
      # ni se versiona; en Easypanel va como secreto. Si falta, no hay admin.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Credencial de servicio del bot (server y bot usan el MISMO valor).
      BOT_TOKEN: ${BOT_TOKEN:-}
      # 1 en producción HTTPS (Easypanel); 0 en dev local por HTTP.
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # 1 solo detrás de un proxy propio que sanee X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Registro público: 1 abierto, 0 cerrado (cualquier otro valor = cerrado).
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-1}
      # Demo/test: TIME_SCALE acelera el ciclo día/noche (1 = normal, 6 = 80 s).
      TIME_SCALE: ${TIME_SCALE:-1}
      TOD_INTERVAL_MS: ${TOD_INTERVAL_MS:-4000}
      MINICRAFT_DIR: /app
      WORLD_FILE: /data/world.json
    volumes:
      - minicraft-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Bot cazador: un CLIENTE más, autenticado con BOT_TOKEN (sin cookie).
  # Sin BOT_TOKEN el proceso sale con error claro en vez de entrar anónimo.
  minicraft-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: minicraft-bot:latest
    environment:
      SERVER_URL: ws://minicraft:3000
      BOT_NAME: OPSX-bot
      BOT_SKIN: ${BOT_SKIN:-robot}
      BOT_TOKEN: ${BOT_TOKEN:-}
    depends_on: [minicraft]
    restart: unless-stopped

volumes:
  minicraft-data:
  minicraft-db:
